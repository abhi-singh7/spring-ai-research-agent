spring:
  ai:
    openai:
      api-key: test-api-key
      base-url: http://localhost:1234
      chat:
          model: test-model
          temperature: 0.7
    mcp:
      client:
        type: SYNC
        tool-name-prefix: "mcp-"
        toolcallback:
          enabled: false
        stdio:
          connections: {}
  # Spring Boot 4 moved Mongo properties from spring.data.mongodb.* to spring.mongodb.*
  mongodb:
    # Tests use a dedicated database on the locally running MongoDB so repeated runs never touch
    # production data. Integration tests clean their collections in @BeforeEach.
    uri: mongodb://localhost:27017/research-agent-test
    representation:
      uuid: STANDARD
  mvc:
    throw-exception-if-no-handler-found: true

# Disable scheduling for tests
spring.devtools.livereload.enabled: false

# SSE timeout (milliseconds) - shorter for tests
spring.ai.sse.timeout: 30000

# JWT authentication for tests (mirrors src/main/resources/application.yml)
app:
  security:
    jwt:
      secret: test-only-jwt-secret-32-bytes-minimum!!
      expiration-seconds: 3600
      issuer: research-agent
  # Abandoned session cleanup scheduler — run every 1 minute in tests
  cleanup:
    stale-after: PT1H
    interval: PT1M

# MCP server configurations for stdio-based servers (Spring AI auto-configured)
spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-lm-i3QQE3mA:UBjIG0O2s6HZOLVFLxvI}
      base-url: ${OLLAMA_BASE_URL:http://localhost:1234}
      chat:
        options:
          model: ${LLM_MODEL:google/gemma-4-26b-a4b-qat}
          ##model: ${LLM_MODEL:qwopus3.6-35b-a3b-v1}
          temperature: 0.7
    mcp:
      client:
        type: SYNC
        tool-name-prefix: "mcp-"   # Prefix for MCP tools to avoid naming conflicts with local tools
        toolcallback:
          enabled: true
        stdio:
          connections:
            # Ollama's hosted web search — 3rd fallback in the McpToolRouter chain (searxng → ddg → ollama_web_search → tavily).
            ollama_web_search:
              command: uv
              args:
                - run
                - /home/abhi/ollama_web_search.py
              env:
                OLLAMA_API_KEY: ${OLLAMA_API_KEY}
            searxng:
              command: npx
              args:
                - "-y"
                - mcp-searxng
              env:
                SEARXNG_URL: http://localhost:9090
            # [browser] extra installs curl_cffi (Chrome TLS impersonation) — DuckDuckGo's bot detection
            # blocks plain httpx clients with empty HTTP 202 pages; search/fetch then auto-fallback to the
            # impersonated backend. See https://github.com/nickclyde/duckduckgo-mcp-server (Backends section).
            ddg_search:
              command: uvx
              args:
                - "--with"
                - "duckduckgo-mcp-server[browser]"
                - duckduckgo-mcp-server
                - --fetch-backend
                - auto

# DataSource configuration for PostgreSQL
spring.datasource.url: jdbc:postgresql://localhost:5432/research-agent
spring.datasource.username: ${DB_USERNAME:postgres}
spring.datasource.password: ${DB_PASSWORD:postgres}
spring.datasource.driver-class-name: org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto: validate
spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
# Use non-contextual LOB creation to avoid PostgreSQL Large Object API (requires non-auto-commit)
# This instructs Hibernate to stream LOB content instead of using PostgreSQL OID-based LOs,
# preventing the "Large Objects may not be used in auto-commit mode" error.
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation: true

# Async thread pool for research tasks
task:
  executor:
    core-pool-size: 5
    max-pool-size: 20
    queue-capacity: 100

# SSE timeout (milliseconds) - 10 minutes default
spring.ai.sse.timeout: 600000

# Abandoned session cleanup scheduler
app:
  research:
    default-max-iterations: 3   # fallback LLM rounds per sub-topic when the request omits maxIterations
  cleanup:
    stale-after: PT15M   # PROCESSING sessions older than this are considered abandoned
    interval: PT20M     # Scheduler runs every 20 minutes (fixed rate)
  search:
    ollama-base-url: https://ollama.com   # hosted API used by WebSearchTool's third fallback backend
    ollama-api-key: ${OLLAMA_API_KEY:}    # Bearer token; empty → the ollama backend reports "not configured" instead of calling out
    tavily-api-key: ${TAVILY_API_KEY:}    # Bearer token for Tavily Search API (final fallback); empty → the tavily backend reports "not configured" instead of calling out

# MCP server configurations for stdio-based servers (Spring AI auto-configured)
spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-unsloth-1e4d14a4ae3f85f3f0cd7dea79719cda}
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:8888/v1}
      # Spring AI 2.0's OpenAI client (openai-java SDK) defaults this to 60s, which kills
      # long LLM calls (final report generation on a local model easily exceeds it):
      # "OpenAIIoException: Stream failed" / InterruptedIOException: timeout at exactly 60s.
      # Sets call/read/write timeouts; keep in sync with spring.ai.sse.timeout below.
      timeout: 600s # a bug in spring-ai 2.0.0-beta.1 prevents this from being applied to the OpenAI client, so we also set directly in the openAI chatOptions bean
      chat:
          model: ${LLM_MODEL:ukisai/Swift-1.5-Qwen3.8-27B-GSQ-RCO-GGUF}
          ##model: ${LLM_MODEL:qwopus3.6-35b-a3b-v1}
          temperature: 0.7
          n: 1
    mcp:
      client:
        type: SYNC
        tool-name-prefix: "mcp-"   # Prefix for MCP tools to avoid naming conflicts with local tools
        toolcallback:
          enabled: true
        stdio:
          connections:
            # Ollama's hosted web search — 3rd fallback in the McpToolRouter chain (firecrawl → ddg → ollama_web_search → tavily).
            ollama_web_search:
              command: uv
              args:
                - run
                - /home/abhi/ollama_web_search.py
              env:
                OLLAMA_API_KEY: ${OLLAMA_API_KEY}
            # [browser] extra installs curl_cffi (Chrome TLS impersonation) — DuckDuckGo's bot detection
            # blocks plain httpx clients with empty HTTP 202 pages; search/fetch then auto-fallback to the
            # impersonated backend. See https://github.com/nickclyde/duckduckgo-mcp-server (Backends section).
            ddg_search:
              command: uvx
              args:
                - "--with"
                - "duckduckgo-mcp-server[browser]"
                - duckduckgo-mcp-server
                - --fetch-backend
                - auto

# MongoDB configuration (PostgreSQL is retained untouched as a rollback path — see AGENTS.md)
# NOTE: Spring Boot 4 moved Mongo properties from spring.data.mongodb.* to spring.mongodb.*
spring.mongodb.uri: mongodb://localhost:27017/research-agent
# UUIDs are stored in the standard (RFC 4122) BSON representation. The one-shot migration script
# (scripts/migrate_pg_to_mongo.py) writes _id values with the same representation — keep them in sync.
spring.mongodb.representation.uuid: STANDARD

# Async thread pool for research tasks
task:
  executor:
    core-pool-size: 5
    max-pool-size: 20
    queue-capacity: 100

# SSE timeout (milliseconds) - 10 minutes default
spring.ai.sse.timeout: 600000

# Abandoned session cleanup scheduler
app:
  # JWT authentication (openspec/changes/add-jwt-authentication)
  # secret: DEV-ONLY default — override in production via the JWT_SECRET env var.
  # JwtService refuses to start with a secret shorter than 32 bytes.
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-research-agent-jwt-secret-change-me!}
      expiration-seconds: 28800   # 8 h — survives a work session, bounds replay value
      issuer: research-agent
  research:
    default-max-iterations: 3   # fallback LLM rounds per sub-topic when the request omits maxIterations
    quality-eval:
      enabled: true             # run a structured quality gate before final report generation
      min-score: 6              # minimum overall score (0–10) to pass without supplementary research
  cache:
    # Web page content cache (openspec/changes/web-content-cache): URL → scraped markdown in Mongo.
    # Entries self-expire via a TTL index on fetchedAt (P7D); keep ttl ≤ P7D or Mongo expires first.
    enabled: true
    ttl: P7D
  cleanup:
    stale-after: PT45M   # PROCESSING sessions older than this are considered abandoned
    interval: PT20M     # Scheduler runs every 20 minutes (fixed rate)
  search:
    firecrawl-base-url: ${FIRECRAWL_BASE_URL:http://localhost:3002}   # self-hosted Firecrawl API — preferred search backend (POST /v2/search) and scrape fallback in UrlReaderTool (POST /v2/scrape)
    ollama-base-url: https://ollama.com   # hosted API used by WebSearchTool's third fallback backend
    ollama-api-key: ${OLLAMA_API_KEY:}    # Bearer token; empty → the ollama backend reports "not configured" instead of calling out
    tavily-api-key: ${TAVILY_API_KEY:}    # Bearer token for Tavily Search API (final fallback); empty → the tavily backend reports "not configured" instead of calling out

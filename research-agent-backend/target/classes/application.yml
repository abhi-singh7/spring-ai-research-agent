spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-lm-i3QQE3mA:UBjIG0O2s6HZOLVFLxvI}
      base-url: ${OLLAMA_BASE_URL:http://localhost:1234}
      chat:
        options:
          model: ${LLM_MODEL:qwopus3.6-35b-a3b-v1}
          temperature: 0.7

# MCP server configurations for stdio-based servers
mcp:
  web-search:
    command: uv
    args:
      - run
      - /home/abhi/ollama_web_search.py
    env:
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
  searxng:
    command: npx
    args:
      - "-y"
      - mcp-searxng
    env:
      SEARXNG_URL: http://localhost:8080
  excalidraw:
    command: node
    args:
      - /home/abhi/excalidraw-mcp/dist/index.js
      - "--stdio"

# DataSource configuration for PostgreSQL
spring.datasource.url: jdbc:postgresql://localhost:5432/research-agent
spring.datasource.username: ${DB_USERNAME:postgres}
spring.datasource.password: ${DB_PASSWORD:postgres}
spring.datasource.driver-class-name: org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto: validate
spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

# Async thread pool for research tasks
task:
  executor:
    core-pool-size: 5
    max-pool-size: 20
    queue-capacity: 100

# SSE timeout (milliseconds) - 10 minutes default
spring.ai.sse.timeout: 600000

name: Research Agent CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  backend-build:

    runs-on: ubuntu-latest

    services:
      # Integration tests (@SpringBootTest) run against a real MongoDB on localhost:27017
      # (see research-agent-backend/src/test/resources/application.yml).
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend
        working-directory: research-agent-backend
        run: mvn clean verify


  frontend-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: research-agent-ui/package-lock.json

      - name: Install dependencies
        working-directory: research-agent-ui
        run: npm ci

      - name: Build Angular application
        working-directory: research-agent-ui
        run: npm run build
